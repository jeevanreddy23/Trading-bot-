# ============================================================
# Aussie Agent Fleet — configuration
# Everything here is safe to edit. Live trading additionally
# requires: mode: live, the --live flag, API keys in env vars,
# and LIVE_TRADING_ACK=I_UNDERSTAND_THE_RISKS in the environment.
# ============================================================

base_currency: AUD
starting_equity: 10000        # paper account size (AUD)

mode: paper                   # paper | live

loop:
  interval_seconds: 15
  state_dir: state

data:
  # first reachable provider wins for each market class
  provider_order: [ccxt, yahoo, stooq, sim]
  sim_seed: 42
  sim_accel: 4                # speeds up simulated price motion so short demos visibly move
  kraken_ws_snapshot: state/kraken_stream.json
  max_quote_age_seconds: 45

markets:
  crypto:
    enabled: true
    venues: [kraken, coinbase, okx, bybit, btcmarkets]
    arb_symbols: ["BTC/USDT", "ETH/USDT"]
    momentum_symbols: ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
    # taker fees in basis points used for net-edge arb maths (verify against your fee tier)
    taker_fees_bps: {kraken: 26, coinbase: 60, okx: 10, bybit: 10, btcmarkets: 85, default: 20}
  stocks:
    enabled: true
    asx: ["BHP.AX", "CBA.AX", "CSL.AX", "WES.AX", "FMG.AX"]
    us: ["AAPL", "MSFT", "NVDA", "SPY", "QQQ"]
  commodities:
    enabled: true
    symbols: ["GC=F", "SI=F", "CL=F", "HG=F", "ZW=F", "NG=F"]
  fx:
    enabled: true
    symbols: ["AUDUSD=X", "EURUSD=X", "USDJPY=X", "GBPUSD=X"]

agents:
  crypto_arb:      {enabled: true, interval: 15, min_net_edge_bps: 5, max_leg_notional_aud: 500}
  crypto_momentum: {enabled: true, interval: 300}
  crypto_ensemble: {enabled: true, interval: 300, min_probability: 0.62, min_ev_pct: 0.05, max_spread_pct: 0.25, max_quote_age_seconds: 45, max_atr_pct: 4.0, round_trip_fees_pct: 0.4}
  stocks:          {enabled: true, interval: 600}
  commodities:     {enabled: true, interval: 600}
  fx:              {enabled: true, interval: 300}

risk:
  max_open_positions: 12
  max_position_pct_equity: 5       # single-position notional cap (% of equity)
  risk_per_trade_pct: 0.75         # % of equity at risk between entry and stop
  max_gross_leverage: 1.0          # 1.0 = unlevered. Raise only deliberately.
                                   # ASIC retail CFD caps: FX majors 30:1, gold/indices 20:1,
                                   # other commodities 10:1, shares 5:1, crypto 2:1.
  max_market_exposure_pct: 40      # cap per market class (% of equity)
  max_daily_loss_pct: 2.0          # stop opening new positions for the (Sydney) day
  kill_drawdown_pct: 6.0           # flatten everything and halt
  max_spread_pct: 0.25
  max_quote_age_seconds: 45
  max_hold_days: 90
  allow_shorts: {crypto: false, stocks: false, commodities: true, fx: true}

execution:
  paper:
    slippage_bps: {crypto: 5, stocks: 4, commodities: 6, fx: 1}
    fee_bps:      {crypto: 20, stocks: 8, commodities: 5, fx: 2}
  live:
    crypto_venue: kraken           # which venue live crypto orders route to
    confirm_env: LIVE_TRADING_ACK  # env var that must equal I_UNDERSTAND_THE_RISKS
    max_order_notional_aud: 200    # hard per-order cap while you build trust in the system
    margin_enabled: false           # spot only; the executor rejects short/margin openings
    oanda_env: practice            # practice | live
